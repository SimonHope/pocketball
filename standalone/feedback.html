<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Feedback</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --panel: #16233d; --line: rgba(255,255,255,.12); --accent: #ff8c42; --text: #fff; --muted: rgba(255,255,255,.65); }
      html, body { margin: 0; background: #0e1830; color: var(--text); font: 14px system-ui, -apple-system, sans-serif; }
      header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 18px; color: #ffd166; }
      header .spacer { flex: 1; }
      label.file { padding: 7px 12px; border-radius: 8px; background: var(--accent); font-weight: 700; cursor: pointer; }
      label.file input { display: none; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
      .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 40px 16px; text-align: center; color: var(--muted); }
      body.dragging .drop { border-color: #ffd166; color: #ffd166; }
      .course { background: var(--panel); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
      .course h2 { margin: 0 0 4px; font-size: 18px; }
      .course .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .course canvas { width: 100%; aspect-ratio: 720 / 420; border-radius: 10px; background: rgba(10, 20, 40, .5); }
      .bars { display: flex; flex-direction: column; gap: 8px; }
      .bar-row .name { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
      .bar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.06); font-size: 11px; font-weight: 700; }
      .bar span { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; color: #10182a; }
      .stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
      .stats b { color: #ffd166; }
      .comments { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
      .legend { font-size: 12px; color: var(--muted); }
      @media (max-width: 760px) { .course { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>📝 Course feedback</h1>
      <label class="file">Open feedback files… <input type="file" id="files" accept=".json,application/json" multiple /></label>
      <label><input type="checkbox" id="current" checked /> Current layouts only</label>
      <span class="spacer"></span>
      <span class="legend">Red dots: falls (where the ball left the floor) · ✕: marked as most frustrating · ★: found on % of finished runs</span>
    </header>
    <main id="out">
      <div class="drop">
        Drop exported feedback files here (Settings → Export course feedback in the game,<br />
        or <code>npm run analytics -- --export feedback.json</code> for everything on the server).
      </div>
    </main>
    <script type="module" src="/src/feedback/main.ts"></script>
  </body>
</html>
