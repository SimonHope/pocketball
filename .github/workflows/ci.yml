name: CI

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    services:
      redis:                      # for the multi-process cluster test
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: standalone/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm run test:e2e   # browser smoke tests (uses the runner's Google Chrome)
